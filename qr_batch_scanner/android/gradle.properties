# Heap/jvm args (sizin zaten vardı, ben daha okunur tuttum)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX + Jetifier (Jetifier kapatıyoruz)
android.useAndroidX=true
android.enableJetifier=false

# Java 17 path — kendi sistemdeki JDK kökünü buraya koy (senin örnek: jdk-17.0.17.10-hotspot)
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.17.10-hotspot
